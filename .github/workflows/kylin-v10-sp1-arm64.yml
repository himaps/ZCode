name: Kylin V10 SP1 aarch64 offline deb

# 银河麒麟 V10 SP1 (aarch64 / glibc 2.31) 离线 deb 构建流水线。
# 规范与红线见 docs/kylin-v10-sp1-offline-deb.md：
# - 构建基线用 ubuntu:20.04 (focal)——与麒麟 V10 SP1 同源同版本（glibc 2.31、包名一致），
#   不用 Debian bullseye（包名错配 + security pool 已 404）；
# - tag `kylin-v10sp1-*` 推送自动触发构建并在验证通过后创建 GitHub Release；
# - 产物：zcode-kylin-v10-sp1-aarch64-glibc2.31-offline.deb

on:
  push:
    tags:
      - 'kylin-v10sp1-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kylin-v10sp1-${{ github.ref }}
  cancel-in-progress: false

env:
  # 与 mise.toml / electron-builder.config.js 的默认镜像一致
  ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
  # 生产身份：包名 zcode、可执行名 zcode、无 _TEST 后缀（desktop-product-identity.mjs）
  ZCODE_ENV: production
  ZCODE_TARGET_OS: linux
  ZCODE_TARGET_ARCH: arm64
  GLIBC_BASELINE: '2.31'

jobs:
  build:
    name: Build offline deb (arm64, cross from x64)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0 # 与 mise.toml 钉住的开发/构建版本一致
          cache: pnpm

      - name: Resolve versions
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ELECTRON_VER=$(node -p "require('./packages/desktop/package.json').devDependencies.electron")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "electron=$ELECTRON_VER" >> "$GITHUB_OUTPUT"
          echo "ZCode $VERSION / Electron $ELECTRON_VER"

      # ---- 快速失败门禁：Electron arm64 主二进制的 GLIBC 引用不得超过 2.31 ----
      # Electron 41 实测只引用到 2.25（rpm 打包注释）；44 尚未实测，门禁说了算。
      - name: "Pre-gate: Electron arm64 glibc baseline"
        run: |
          set -euo pipefail
          VER="${{ steps.version.outputs.electron }}"
          TMP=$(mktemp -d)
          ok=0
          for url in \
            "https://github.com/electron/electron/releases/download/v${VER}/electron-v${VER}-linux-arm64.zip" \
            "${ELECTRON_MIRROR}${VER}/electron-v${VER}-linux-arm64.zip"; do
            for attempt in 1 2 3; do
              if curl -fL --retry 3 --connect-timeout 30 -o "$TMP/electron.zip" "$url"; then ok=1; break 2; fi
              echo "下载重试 $attempt/3: $url"
              sleep 5
            done
          done
          [ "$ok" = "1" ] || { echo "::error::无法下载 Electron ${VER} linux-arm64.zip"; exit 1; }
          unzip -q -o "$TMP/electron.zip" -d "$TMP/dist"
          top=$(objdump -T "$TMP/dist/electron" 2>/dev/null | grep -oE 'GLIBC_[0-9.]+' | sort -uV | tail -1 || true)
          top=${top#GLIBC_}
          [ -n "$top" ] || { echo "::error::无法解析 Electron 主二进制的 GLIBC 符号"; exit 1; }
          higher=$(printf '%s\n%s\n' "$GLIBC_BASELINE" "$top" | sort -V | tail -1)
          if [ "$higher" != "$GLIBC_BASELINE" ]; then
            echo "::error::Electron ${VER} arm64 要求 GLIBC_${top}，超过麒麟 V10 SP1 基线 ${GLIBC_BASELINE}；需要降级 Electron 或另定交付基线"
            exit 1
          fi
          echo "Electron ${VER} arm64 最高 GLIBC 引用 ${top} <= ${GLIBC_BASELINE}，预检通过"

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile; then exit 0; fi
            echo "pnpm install 重试 $attempt/3"
            sleep 10
          done
          exit 1

      - name: Build desktop app (linux/arm64)
        run: pnpm --filter @zcode/desktop build

      - name: Package with electron-builder (dir target)
        run: |
          # dir 目标不依赖 fpm/appimage 等 builder 辅助工具；复用 electron-builder.config.js
          # 的 afterPack 运行时闭包注入与 native 资源边界校验。
          # 指南§5：logs API 匿名 401，失败日志尾部必须重发成 ::error:: 注解（title 唯一化）
          # 才能匿名诊断；完整日志随 artifact 留存。
          log="$GITHUB_WORKSPACE/electron-builder.log"
          ok=0
          for attempt in 1 2 3; do
            if pnpm --filter @zcode/desktop exec electron-builder --linux dir --arm64 2>&1 | tee "$log"; then
              ok=1
              break
            fi
            echo "electron-builder 重试 $attempt/3（瞬时下载失败按 bundle.mjs 同款策略重试）"
            sleep 15
          done
          if [ "$ok" != "1" ]; then
            # 优先取错误关键词行；没有命中再取日志末尾。注解每级每步上限 10 条，title 唯一化。
            diag=$(tail -40 "$log" | tr -d '\r' | grep -iE 'error|cannot|failed|exception|ENOENT|EACCES|not found|ELIFECYCLE' | tail -10)
            if [ -z "$diag" ]; then
              diag=$(tail -10 "$log" | tr -d '\r')
            fi
            printf '%s\n' "$diag" | awk '{ i++; gsub(/%/, "%25"); print "::error title=electron-builder-diag-" i " ::" substr($0, 1, 400) }'
            exit 1
          fi

      - name: Upload electron-builder log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: electron-builder-log
          path: electron-builder.log
          if-no-files-found: ignore

      - name: Assert linux-unpacked payload
        run: |
          # electron-builder 26.17 跨架构（目标≠默认架构）输出目录带架构后缀：
          # platformPackager.js computeDistOut = <platform><archSuffix>-unpacked。
          # arm64 → linux-arm64-unpacked；旧版命名 linux-unpacked 作回退。
          dist=packages/desktop/dist
          if [ -d "$dist/linux-arm64-unpacked" ]; then
            unpacked="$dist/linux-arm64-unpacked"
          elif [ -d "$dist/linux-unpacked" ]; then
            unpacked="$dist/linux-unpacked"
          else
            echo "dist 顶层内容:"; ls -la "$dist/" 2>/dev/null || true
            echo "::error title=payload-missing-unpacked ::dist 下没有 linux-arm64-unpacked / linux-unpacked；dist 顶层见步骤日志"
            find packages/desktop -maxdepth 2 -name dist -type d 2>/dev/null | head -5
            exit 1
          fi
          echo "UNPACKED_DIR=$unpacked" >> "$GITHUB_ENV"
          ls "$unpacked" | head -30
          check() {
            local label="$1" path="$2" mode="$3"
            if [ "$mode" = "x" ]; then test -x "$path" || { echo "::error title=payload-$label ::缺少或不可执行: $path"; exit 1; }
            else test -f "$path" || { echo "::error title=payload-$label ::缺少文件: $path"; exit 1; }; fi
          }
          check zcode "$unpacked/zcode" x
          check app-asar "$unpacked/resources/app.asar" f
          check chrome-sandbox "$unpacked/chrome-sandbox" f

      # ---- focal amd64 容器内下载 arm64 离线依赖闭包 ----
      # ubuntu:20.04 为冻结 tag（glibc 恒为 2.31.x），无 distrotwin 滚动 tag 漂移风险；
      # 如需更强复现性可再钉 digest。
      - name: Collect arm64 dependency closure (focal container)
        run: |
          mkdir -p dist/kylin
          docker run --rm \
            -v "$PWD:/repo" -w /repo \
            ubuntu:20.04 \
            bash packaging/kylin/v10-sp1/collect-offline-closure.sh \
              dist/kylin/closure packaging/kylin/v10-sp1/depends-seeds.txt
          echo "闭包清单（前 20 行）:"; head -20 dist/kylin/closure/closure-manifest.txt

      - name: Assemble offline deb
        id: paths
        run: |
          bash packaging/kylin/v10-sp1/build-offline-deb.sh \
            "${UNPACKED_DIR:?assert 步骤未解析出载荷目录}" \
            dist/kylin/closure \
            "${{ steps.version.outputs.version }}" \
            dist/kylin
          echo "deliverable=dist/kylin/zcode-kylin-v10-sp1-aarch64-glibc2.31-offline.deb" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kylin-v10sp1-arm64-offline-deb
          path: |
            dist/kylin/*.deb
            dist/kylin/*.sha256
            dist/kylin/glibc-scan-report.txt
            dist/kylin/closure-manifest.txt
          if-no-files-found: error

  verify:
    name: Verify in arm64 focal container
    needs: build
    runs-on: ${{ vars.ZCODE_ARM64_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 90
    steps:
      - name: Detect host architecture
        id: host
        run: echo "arch=$(uname -m)" >> "$GITHUB_OUTPUT"

      # x64 宿主需要 QEMU binfmt 才能运行 arm64 容器；原生 arm64 runner（公开仓库免费
      # 的 ubuntu-24.04-arm，或 vars.ZCODE_ARM64_RUNNER 指定）跳过模拟直接运行。
      - if: steps.host.outputs.arch != 'aarch64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: actions/download-artifact@v4
        with:
          name: kylin-v10sp1-arm64-offline-deb
          path: dist/kylin

      - uses: actions/checkout@v4

      - name: Verify offline deb
        env:
          # 原生 arm64：运行时冒烟是硬门禁；QEMU：冒烟失败仅告警（模拟器不判真机死刑）
          ZCODE_VERIFY_NATIVE: ${{ steps.host.outputs.arch == 'aarch64' && '1' || '0' }}
        run: |
          docker run --rm \
            --platform linux/arm64 \
            -v "$PWD:/repo" -w /repo \
            -e ZCODE_VERIFY_NATIVE \
            ubuntu:20.04 \
            bash packaging/kylin/v10-sp1/verify-offline-deb.sh \
              dist/kylin/zcode-kylin-v10-sp1-aarch64-glibc2.31-offline.deb

  release:
    name: GitHub Release (tag only)
    needs: [build, verify]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kylin-v10sp1-arm64-offline-deb
          path: dist/kylin

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          # 引号 heredoc：notes 里的反引号代码块不能被 shell 当作命令替换
          cat > /tmp/release-notes.md <<'EOF'
          ## ZCode @VERSION@ — 银河麒麟 V10 SP1 (aarch64) 离线安装包

          - 目标系统：银河麒麟桌面 V10 SP1（2503）aarch64，glibc 2.31（focal 同源基线）
          - 产物：`zcode-kylin-v10-sp1-aarch64-glibc2.31-offline.deb`（应用本体 + 离线依赖闭包 + 补齐脚本）
          - 已通过：GLIBC 符号门禁（<= 2.31）、focal arm64 容器安装验证、零升级断言（绝不升级系统组件）、ldd 零 not found
          - 不适用于：麒麟 V10 原版（glibc 2.23）、x86_64 机器

          ### 安装
          ```sh
          sudo dpkg -i zcode-kylin-v10-sp1-aarch64-glibc2.31-offline.deb
          # 缺依赖时自动延迟补装；结果查看: journalctl -u zcode-deps
          # 也可手动补齐: sudo /opt/ZCode/offline-deps/install-deps.sh
          ```
          EOF
          sed -i "s/@VERSION@/${VERSION}/g" /tmp/release-notes.md
          for attempt in 1 2 3; do
            if gh release create "$TAG" \
                dist/kylin/zcode-kylin-v10-sp1-aarch64-glibc2.31-offline.deb \
                dist/kylin/zcode-kylin-v10-sp1-aarch64-glibc2.31-offline.deb.sha256 \
                --title "ZCode ${VERSION} Kylin V10 SP1 aarch64 (offline)" \
                --notes-file /tmp/release-notes.md; then
              exit 0
            fi
            echo "gh release create 重试 $attempt/3"
            sleep 10
          done
          exit 1
