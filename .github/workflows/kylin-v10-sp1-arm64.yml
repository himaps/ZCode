name: Kylin V10 SP1 aarch64 offline deb

# 银河麒麟 V10 SP1 (aarch64 / glibc 2.31) 离线 deb 构建流水线。
# 规范与红线见 docs/kylin-v10-sp1-offline-deb.md：
# - 构建基线用 ubuntu:20.04 (focal)——与麒麟 V10 SP1 同源同版本（glibc 2.31、包名一致），
#   不用 Debian bullseye（包名错配 + security pool 已 404）；
# - tag `kylin-v10sp1-*` 推送自动触发构建并在验证通过后创建 GitHub Release；
# - 产物：zcode-kylin-v10-sp1-aarch64-glibc2.31-offline.deb

on:
  push:
    tags:
      - 'kylin-v10sp1-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kylin-v10sp1-${{ github.ref }}
  cancel-in-progress: false

env:
  # 与 mise.toml / electron-builder.config.js 的默认镜像一致
  ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
  # 生产身份：包名 zcode、可执行名 zcode、无 _TEST 后缀（desktop-product-identity.mjs）
  ZCODE_ENV: production
  ZCODE_TARGET_OS: linux
  ZCODE_TARGET_ARCH: arm64
  GLIBC_BASELINE: '2.31'

jobs:
  build:
    name: Build offline deb (arm64, cross from x64)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0 # 与 mise.toml 钉住的开发/构建版本一致
          cache: pnpm

      - name: Resolve versions
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ELECTRON_VER=$(node -p "require('./packages/desktop/package.json').devDependencies.electron")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "electron=$ELECTRON_VER" >> "$GITHUB_OUTPUT"
          echo "ZCode $VERSION / Electron $ELECTRON_VER"

      # ---- 快速失败门禁：Electron arm64 主二进制的 GLIBC 引用不得超过 2.31 ----
      # Electron 41 实测只引用到 2.25（rpm 打包注释）；44 尚未实测，门禁说了算。
      - name: "Pre-gate: Electron arm64 glibc baseline"
        run: |
          set -euo pipefail
          VER="${{ steps.version.outputs.electron }}"
          TMP=$(mktemp -d)
          ok=0
          for url in \
            "https://github.com/electron/electron/releases/download/v${VER}/electron-v${VER}-linux-arm64.zip" \
            "${ELECTRON_MIRROR}${VER}/electron-v${VER}-linux-arm64.zip"; do
            for attempt in 1 2 3; do
              if curl -fL --retry 3 --connect-timeout 30 -o "$TMP/electron.zip" "$url"; then ok=1; break 2; fi
              echo "下载重试 $attempt/3: $url"
              sleep 5
            done
          done
          [ "$ok" = "1" ] || { echo "::error::无法下载 Electron ${VER} linux-arm64.zip"; exit 1; }
          unzip -q -o "$TMP/electron.zip" -d "$TMP/dist"
          top=$(objdump -T "$TMP/dist/electron" 2>/dev/null | grep -oE 'GLIBC_[0-9.]+' | sort -uV | tail -1 || true)
          top=${top#GLIBC_}
          [ -n "$top" ] || { echo "::error::无法解析 Electron 主二进制的 GLIBC 符号"; exit 1; }
          higher=$(printf '%s\n%s\n' "$GLIBC_BASELINE" "$top" | sort -V | tail -1)
          if [ "$higher" != "$GLIBC_BASELINE" ]; then
            echo "::error::Electron ${VER} arm64 要求 GLIBC_${top}，超过麒麟 V10 SP1 基线 ${GLIBC_BASELINE}；需要降级 Electron 或另定交付基线"
            exit 1
          fi
          echo "Electron ${VER} arm64 最高 GLIBC 引用 ${top} <= ${GLIBC_BASELINE}，预检通过"

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile; then exit 0; fi
            echo "pnpm install 重试 $attempt/3"
            sleep 10
          done
          exit 1

      - name: Build desktop app (linux/arm64)
        run: pnpm --filter @zcode/desktop build

      - name: Inject app version into desktop package.json
        run: |
          # electron-builder 26.17 的 checkMetadata 直接读原始 package.json 的 version，
          # config 顶级 extraMetadata 注入在该阶段失效（26.8.1 尚可，升级回归）。
          # CI 内临时注入不落库；files: ["package.json"] 会把版本打进 asar，app.getVersion() 正常。
          node -e "const fs=require('fs');const f='packages/desktop/package.json';const p=JSON.parse(fs.readFileSync(f,'utf8'));p.version='${{ steps.version.outputs.version }}';fs.writeFileSync(f, JSON.stringify(p,null,2)+'\n')"
          node -p "require('./packages/desktop/package.json').version"

      - name: Package with electron-builder (dir target)
        # 显式 bash = -eo pipefail：默认 shell 无 pipefail，tee 会吞掉 electron-builder
        # 的失败退出码，导致"打包成功"的假象（首轮排障教训，指南§6 同类坑）。
        shell: bash
        env:
          # 与 prepare-agent-node-bundle 同款防护：禁止 pnpm 在 run/exec 前自动触发
          # 子工程 install（其 postinstall 会 electron-rebuild，打包阶段必须复用安装期产物）。
          PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"
        run: |
          # dir 目标不依赖 fpm/appimage 等 builder 辅助工具；复用 electron-builder.config.js
          # 的 afterPack 运行时闭包注入与 native 资源边界校验。
          # 指南§5：logs API 匿名 401，失败日志必须重发成 ::error:: 注解（title 唯一化）。
          # cpu-features 是 ssh2 的可选原生加速（nan 头文件无法在 Electron 44 的 V8 下编译，
          # 且本就被打包裁剪、缺失时 ssh2 自动降级）：打包前移除，避免 electron-builder 的
          # 依赖脚本阶段对它做无谓的 node-gyp 编译并拖垮整个打包。
          rm -rf node_modules/cpu-features
          log="$GITHUB_WORKSPACE/electron-builder.log"
          ok=0
          for attempt in 1 2 3; do
            if pnpm --filter @zcode/desktop exec electron-builder \
                --linux dir --arm64 -c.npmRebuild=false 2>&1 | tee "$log"; then
              ok=1
              break
            fi
            echo "electron-builder 重试 $attempt/3（瞬时下载失败按 bundle.mjs 同款策略重试）"
            sleep 15
          done
          if [ "$ok" != "1" ]; then
            # 诊断块：关键词行 + 首处编译错误的上下文，总计截到 10 行（GitHub 每步注解上限）
            {
              echo "== keyword lines =="
              grep -aE '⨯|ERR_PNPM|gyp ERR|gyp info|cpu-features|node-pty|ssh2|rebuilding|rebuild' "$log" | tr -d '\r' | head -5
              first=$(grep -an 'nan_callbacks\|gyp ERR\|error:' "$log" | head -1 | cut -d: -f1)
              if [ -n "$first" ]; then
                echo "== context of first compile error (line $first) =="
                start=$((first > 6 ? first - 6 : 1))
                sed -n "${start},$((first + 1))p" "$log" | tr -d '\r' | head -8
              fi
            } > /tmp/eb-diag.txt
            head -10 /tmp/eb-diag.txt | awk '{ i++; gsub(/%/, "%25"); print "::error title=eb-diag-" i " ::" substr($0, 1, 400) }'
            exit 1
          fi

      - name: Upload electron-builder log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: electron-builder-log
          path: electron-builder.log
          if-no-files-found: ignore

      - name: Assert linux-unpacked payload
        run: |
          # 诊断先行（logs API 匿名 401，只能靠注解）：
          # electron-builder 日志的 packaging 行直接带 appOutDir，注解出来即可定位。
          grep -aE 'appOutDir|building|packaging ' electron-builder.log | tr -d '\r' | head -8 | awk '{ i++; gsub(/%/, "%25"); print "::error title=eb-log-" i " ::" substr($0, 1, 300) }' || true
          # electron-builder 26.17 跨架构（目标≠默认架构）输出目录带架构后缀：
          # platformPackager.js computeAppOutDir = <platform><archSuffix>-unpacked。
          # arm64 → linux-arm64-unpacked；旧版命名或根目录相对 dist 作回退候选。
          for cand in \
            packages/desktop/dist/linux-arm64-unpacked \
            packages/desktop/dist/linux-unpacked \
            dist/linux-arm64-unpacked \
            dist/linux-unpacked; do
            if [ -d "$cand" ]; then
              unpacked="$cand"
              break
            fi
          done
          if [ -z "${unpacked:-}" ]; then
            ls -la packages/desktop/dist/ 2>/dev/null | head -12 | awk '{ i++; gsub(/%/, "%25"); print "::error title=dist-list-" i " ::" substr($0, 1, 280) }'
            find . -maxdepth 4 -type d -name '*unpacked*' -not -path '*/node_modules/*' 2>/dev/null | head -5 | awk '{ i++; gsub(/%/, "%25"); print "::error title=dist-find-" i " ::" substr($0, 1, 280) }'
            echo "::error title=payload-missing-unpacked ::未找到 unpacked 载荷目录"
            exit 1
          fi
          echo "UNPACKED_DIR=$unpacked" >> "$GITHUB_ENV"
          echo "unpacked=$unpacked" >> "$GITHUB_STEP_SUMMARY"
          if [ ! -x "$unpacked/zcode" ]; then
            # 可执行名未按 executableName=zcode 生成时，列出目录并把事实发注解；
            # electron-builder 26.17 的 dir 目标实测沿用包名默认（@zcodedesktop），
            # 按 electron-builder 的重命名语义把原名二进制归一为 zcode 继续。
            ls -la "$unpacked" | head -12 | awk '{ i++; gsub(/%/, "%25"); print "::error title=unpacked-list-" i " ::" substr($0, 1, 300) }'
            for raw in electron '@zcodedesktop'; do
              if [ -f "$unpacked/$raw" ]; then
                mv "$unpacked/$raw" "$unpacked/zcode"
                chmod 755 "$unpacked/zcode"
                echo "::error title=payload-rename ::executableName 未生效：已把 $raw 改名为 zcode 继续"
                break
              fi
            done
          fi
          check() {
            local label="$1" path="$2" mode="$3"
            if [ "$mode" = "x" ]; then test -x "$path" || { echo "::error title=payload-$label ::缺少或不可执行: $path"; exit 1; }
            else test -f "$path" || { echo "::error title=payload-$label ::缺少文件: $path"; exit 1; }; fi
          }
          check zcode "$unpacked/zcode" x
          check app-asar "$unpacked/resources/app.asar" f
          check chrome-sandbox "$unpacked/chrome-sandbox" f

      # ---- focal amd64 容器内下载 arm64 离线依赖闭包 ----
      # ubuntu:20.04 为冻结 tag（glibc 恒为 2.31.x），无 distrotwin 滚动 tag 漂移风险；
      # 如需更强复现性可再钉 digest。
      - name: Collect arm64 dependency closure (focal container)
        shell: bash
        run: |
          mkdir -p dist/kylin
          if docker run --rm \
            -v "$PWD:/repo" -w /repo \
            ubuntu:20.04 \
            bash packaging/kylin/v10-sp1/collect-offline-closure.sh \
              dist/kylin/closure packaging/kylin/v10-sp1/depends-seeds.txt 2>&1 | tee dist/kylin/closure.log; then
            echo "闭包清单（前 20 行）:"; head -20 dist/kylin/closure/closure-manifest.txt
          else
            # 注解诊断：apt 错误行优先，兜底日志尾部（每步注解上限 10 条）
            {
              grep -aE 'E: |error|failed|失败|Could not|Unable' dist/kylin/closure.log | tr -d '\r' | head -7
              echo "== tail =="
              tail -4 dist/kylin/closure.log | tr -d '\r'
            } > /tmp/closure-diag.txt
            head -10 /tmp/closure-diag.txt | awk '{ i++; gsub(/%/, "%25"); print "::error title=closure-diag-" i " ::" substr($0, 1, 400) }'
            exit 1
          fi

      - name: Assemble offline deb
        id: paths
        run: |
          bash packaging/kylin/v10-sp1/build-offline-deb.sh \
            "${UNPACKED_DIR:?assert 步骤未解析出载荷目录}" \
            dist/kylin/closure \
            "${{ steps.version.outputs.version }}" \
            dist/kylin
          echo "deliverable=dist/kylin/zcode-kylin-v10-sp1-aarch64-glibc2.31-offline.deb" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kylin-v10sp1-arm64-offline-deb
          path: |
            dist/kylin/*.deb
            dist/kylin/*.sha256
            dist/kylin/glibc-scan-report.txt
            dist/kylin/closure-manifest.txt
          if-no-files-found: error

  verify:
    name: Verify in arm64 focal container
    needs: build
    runs-on: ${{ vars.ZCODE_ARM64_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 90
    steps:
      - name: Detect host architecture
        id: host
        run: echo "arch=$(uname -m)" >> "$GITHUB_OUTPUT"

      # x64 宿主需要 QEMU binfmt 才能运行 arm64 容器；原生 arm64 runner（公开仓库免费
      # 的 ubuntu-24.04-arm，或 vars.ZCODE_ARM64_RUNNER 指定）跳过模拟直接运行。
      - if: steps.host.outputs.arch != 'aarch64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: actions/download-artifact@v4
        with:
          name: kylin-v10sp1-arm64-offline-deb
          path: dist/kylin

      - uses: actions/checkout@v4

      - name: Verify offline deb
        env:
          # 原生 arm64：运行时冒烟是硬门禁；QEMU：冒烟失败仅告警（模拟器不判真机死刑）
          ZCODE_VERIFY_NATIVE: ${{ steps.host.outputs.arch == 'aarch64' && '1' || '0' }}
        run: |
          docker run --rm \
            --platform linux/arm64 \
            -v "$PWD:/repo" -w /repo \
            -e ZCODE_VERIFY_NATIVE \
            ubuntu:20.04 \
            bash packaging/kylin/v10-sp1/verify-offline-deb.sh \
              dist/kylin/zcode-kylin-v10-sp1-aarch64-glibc2.31-offline.deb

  release:
    name: GitHub Release (tag only)
    needs: [build, verify]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kylin-v10sp1-arm64-offline-deb
          path: dist/kylin

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          # 引号 heredoc：notes 里的反引号代码块不能被 shell 当作命令替换
          cat > /tmp/release-notes.md <<'EOF'
          ## ZCode @VERSION@ — 银河麒麟 V10 SP1 (aarch64) 离线安装包

          - 目标系统：银河麒麟桌面 V10 SP1（2503）aarch64，glibc 2.31（focal 同源基线）
          - 产物：`zcode-kylin-v10-sp1-aarch64-glibc2.31-offline.deb`（应用本体 + 离线依赖闭包 + 补齐脚本）
          - 已通过：GLIBC 符号门禁（<= 2.31）、focal arm64 容器安装验证、零升级断言（绝不升级系统组件）、ldd 零 not found
          - 不适用于：麒麟 V10 原版（glibc 2.23）、x86_64 机器

          ### 安装
          ```sh
          sudo dpkg -i zcode-kylin-v10-sp1-aarch64-glibc2.31-offline.deb
          # 缺依赖时自动延迟补装；结果查看: journalctl -u zcode-deps
          # 也可手动补齐: sudo /opt/ZCode/offline-deps/install-deps.sh
          ```
          EOF
          sed -i "s/@VERSION@/${VERSION}/g" /tmp/release-notes.md
          for attempt in 1 2 3; do
            if gh release create "$TAG" \
                dist/kylin/zcode-kylin-v10-sp1-aarch64-glibc2.31-offline.deb \
                dist/kylin/zcode-kylin-v10-sp1-aarch64-glibc2.31-offline.deb.sha256 \
                --title "ZCode ${VERSION} Kylin V10 SP1 aarch64 (offline)" \
                --notes-file /tmp/release-notes.md; then
              exit 0
            fi
            echo "gh release create 重试 $attempt/3"
            sleep 10
          done
          exit 1
